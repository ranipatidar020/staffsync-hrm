services:
  - type: web
    name: staffsync-hrm
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: MONGODB_URI
        sync: false   # paste your Atlas connection string in the Render dashboard
